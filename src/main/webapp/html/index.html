<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="snippets.html :: header(title='Index')"></head>
  <body>
    <div th:replace="~{fragments/navbar.html :: navbar}"></div>

    <div class="container">
      <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Employee Management System</h1>
        <p class="col-md-8 fs-4">Add a new employee to get started.</p>
        <form action="/employee/api" th:action="@{/api}" method="POST">
          <div class="mb-3">
            <label for="id" class="form-label">ID</label>
            <input type="text" class="form-control" id="id" name="id" required />
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required />
          </div>
          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="text" class="form-control" id="age" name="age" required />
          </div>
          <button type="submit" class="btn btn-primary">Add Employee</button>
        </form>
      </div>
      <a class="btn btn-primary btn-lg" href="/employee/ui/home" th:href="@{/ui/home}" role="button">Learn mOre</a>

      <h2>All Employees</h2>
      <table class="table table-striped" id="employee-table">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Age</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/employee/html/app.js" th:src="@{/html/app.js}"></script>
  </body>
</html>
